name: Feature or requirement
description: Describe an outcome for the holiday planner
title: "[Feature] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Who needs what, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should we know this is done?
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
